server.port=8084

spring.application.name=alert-service
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# =========================
# MONGODB CONFIG
# =========================

spring.data.mongodb.uri=${ALERT_MONGODB_URI:mongodb://localhost:27017/smartops_alert_db}

# =========================
# KAFKA CONFIG
# =========================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

spring.kafka.consumer.group-id=alert-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# =========================
# EUREKA CONFIG
# =========================

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =========================
# ACTUATOR
# =========================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =========================
# LOGGING
# =========================

logging.level.root=INFO

spring.kafka.consumer.properties.spring.json.trusted.packages=com.smartops.common.event
